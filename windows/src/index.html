<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Playporter</title>
  </head>
  <body>
    <header>
      <span class="logo">📦</span>
      <h1>Playporter</h1>
      <div class="spacer"></div>
      <button id="signin" class="btn" hidden>Se connecter avec Google</button>
      <button id="account" class="account" hidden></button>
    </header>

    <main>
      <div id="drop" class="drop">
        <div class="drop-inner">
          <div class="drop-title">Dépose un fichier .aab ici</div>
          <div class="drop-sub">Il sera envoyé en Test interne sur l'app correspondante</div>
        </div>
      </div>
      <div id="result" class="result" hidden></div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
